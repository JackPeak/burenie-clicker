
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Burenie Clicker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg:#0f1115; --p1:#181c24; --p2:#1f2430; --b:#2c3344;
      --gold:#f59e0b; --ora:#ea580c; --cyn:#06b6d4; --grn:#22c55e; --red:#ef4444;
      --txt:#f3f4f6; --mut:#9ca3af;
    }
    * { box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
    body { margin:0; padding:10px 12px 132px; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); }
    .app { max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
    .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
    .card { background:var(--p1); border:1px solid var(--b); border-radius:10px; padding:7px 4px; text-align:center; }
    .lbl { font-size:10px; color:var(--mut); }
    .val { font-size:12px; font-weight:700; color:var(--gold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cyn{color:var(--cyn)} .ora{color:var(--ora)} .grn{color:var(--grn)} .red{color:var(--red)}
    .panel { background:var(--p1); border:1px solid var(--b); border-radius:12px; padding:12px; }
    .hidden { display:none!important; }
    .row { display:flex; justify-content:space-between; font-size:12px; color:var(--mut); margin-bottom:4px; }
    .bar { width:100%; height:9px; background:#0006; border-radius:99px; overflow:hidden; margin-bottom:8px; }
    .fill-bat { height:100%; background:linear-gradient(90deg,var(--grn),var(--cyn)); transition:width .12s; }
    .fill-heat { height:100%; background:linear-gradient(90deg,var(--cyn),var(--gold),var(--red)); transition:width .12s; }
    .warn { background:#ef444433; border:1px solid #ef444488; color:#fecaca; border-radius:8px; padding:7px 10px; font-size:12px; text-align:center; margin-bottom:8px; }
    .stage { position:relative; height:190px; border-radius:10px; border:1px solid #fff2; background:linear-gradient(180deg,#161b26,#2d1b12); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:10px; overflow:hidden; cursor:pointer; }
    .rig { font-size:44px; transition:transform .12s; }
    .rig.spin { animation:shake .14s infinite alternate; }
    @keyframes shake { from{transform:translateY(2px) rotate(-2deg)} to{transform:translateY(8px) rotate(2deg)} }
    .ground { width:100%; background:#3b2113; border-top:2px solid #9a3412; border-radius:8px; padding:6px 8px; text-align:center; font-size:11px; color:#fde68a; font-weight:700; }
    .btn { border:none; border-radius:10px; padding:10px; font-size:13px; font-weight:700; cursor:pointer; }
    .btn-off { width:100%; margin-top:8px; background:var(--ora); color:#fff; }
    .btn-off.is-off { background:var(--grn); color:#06180c; }
    .list { display:flex; flex-direction:column; gap:8px; }
    .item { display:flex; justify-content:space-between; align-items:center; background:var(--p2); border:1px solid var(--b); border-radius:10px; padding:10px; }
    .sub { font-size:11px; color:var(--mut); }
    .sell { background:#22c55e28; border:1px solid #22c55e77; color:#86efac; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer; }
    .sell:disabled { opacity:.35; cursor:not-allowed; }
    .m-act { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    .u-lvl { background:var(--cyn); color:#051217; }
    .u-tier { background:var(--gold); color:#1c1202; }
    .btn:disabled { opacity:.35; cursor:not-allowed; }
    .dock { position:fixed; left:0; right:0; bottom:0; z-index:20; background:#12161ef5; border-top:1px solid var(--b); padding:8px 12px calc(8px + env(safe-area-inset-bottom)); }
    .dock-in { max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
    .slider-box { background:var(--p2); border:1px solid var(--b); border-radius:9px; padding:6px 10px; font-size:12px; }
    .slider-box input { width:100%; accent-color:var(--ora); margin-top:3px; }
    .nav { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .tab { background:var(--p2); border:1px solid var(--b); color:var(--mut); border-radius:9px; padding:9px 4px; font-size:12px; font-weight:700; cursor:pointer; }
    .tab.active { background:var(--ora); border-color:var(--ora); color:#fff; }
    .foot { display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:11px; color:var(--mut); }
    .rst { background:none; border:1px solid var(--b); color:var(--mut); border-radius:7px; padding:5px 9px; font-size:11px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="app">
    <div class="grid4">
      <div class="card"><div class="lbl">МОНЕТЫ</div><div class="val" id="sCoins">0</div></div>
      <div class="card"><div class="lbl">ГЛУБИНА</div><div class="val cyn" id="sDepth">0.0 м</div></div>
      <div class="card"><div class="lbl">ЗАРЯД</div><div class="val ora" id="sBat">4.0 ч</div></div>
      <div class="card"><div class="lbl">СКЛАД</div><div class="val grn" id="sStor">0/5 т</div></div>
    </div>

    <div class="panel" id="p-drill">
      <div class="row"><span id="lBat">Батарея: 4.0 / 4.0 ч</span><span id="pBat">100%</span></div>
      <div class="bar"><div class="fill-bat" id="bBat"></div></div>

      <div class="row"><span id="lHeat">Нагрев: Норма</span><span id="pHeat">0%</span></div>
      <div class="bar"><div class="fill-heat" id="bHeat"></div></div>

      <div class="warn hidden" id="warnBox"></div>

      <div class="stage" id="stage">
        <div class="rig" id="rig">⛏️</div>
        <div class="ground" id="groundTxt">Горизонт: Верхняя земля</div>
      </div>

      <button class="btn btn-off" id="toggleDrillBtn">🔌 ОТРУБИТЬ БУР</button>

      <div class="foot">
        <span>Тап по сцене — заряд АКБ</span>
        <button class="rst" id="resetBtn">Сброс</button>
      </div>
    </div>

    <div class="panel hidden" id="p-inv">
      <div class="row" style="margin-bottom:8px;"><span id="invCap">Склад: 0 / 5 т</span><span id="invSum">Сумма: 0</span></div>
      <button class="sell" style="width:100%;padding:9px;margin-bottom:8px;" id="sellAllBtn">Забрать и продать всё</button>
      <div class="list" id="invList"></div>
    </div>

    <div class="panel hidden" id="p-mod">
      <div class="list" id="modList"></div>
    </div>
  </div>

  <div class="dock">
    <div class="dock-in">
      <div class="slider-box">
        <div class="row" style="margin:0;">
          <span>Мощность бура: <strong id="pwrVal">100%</strong></span>
          <span id="pwrInfo">Нагрев ×1.00 • АКБ 100%</span>
        </div>
        <input type="range" id="pwrSlider" min="20" max="100" step="5" value="100" />
      </div>
      <div class="nav">
        <button class="tab active" data-p="drill">⛏️ Бурение</button>
        <button class="tab" data-p="inv">🎒 Инвентарь</button>
        <button class="tab" data-p="mod">⚙️ Модули</button>
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram?.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
    const KEY = "burenie_compact_v1";

    const RES = [
      { id: "dirt", name: "Земля", icon: "🟫", perTon: 12 },
      { id: "stone", name: "Камень", icon: "🪨", perTon: 28 },
      { id: "coal", name: "Уголь", icon: "⬛", perTon: 65 },
      { id: "iron", name: "Железная руда", icon: "⛓️", perTon: 140 },
      { id: "gold", name: "Золотая руда", icon: "🪙", perTon: 320 }
    ];

    const HORIZONS = [
      { d: 0, name: "Верхняя земля", v: 0.8, kg: 90, w: [["dirt", 0.8, 1.1], ["stone", 0.2, 0.9]] },
      { d: 80, name: "Плотный грунт", v: 0.7, kg: 220, w: [["dirt", 0.4, 1.0], ["stone", 0.6, 1.1]] },
      { d: 220, name: "Угольный пласт", v: 0.6, kg: 520, w: [["stone", 0.4, 0.95], ["coal", 0.6, 1.15]] },
      { d: 450, name: "Рудная жила", v: 0.5, kg: 1240, w: [["coal", 0.35, 1.0], ["iron", 0.65, 1.2]] },
      { d: 800, name: "Глубинный горизонт", v: 0.4, kg: 2900, w: [["iron", 0.5, 1.1], ["gold", 0.5, 1.25]] }
    ];

    const defState = () => ({
      coins: 0, depth: 0, energy: 4.0, power: 100, manualOff: false,
      heat: 0, overheated: false, brokenUntil: 0,
      inv: { dirt: 0, stone: 0, coal: 0, iron: 0, gold: 0 },
      mod: {
        drill: { lvl: 1, tier: 1 },
        battery: { lvl: 1, tier: 1 },
        collector: { lvl: 1, tier: 1 },
        cooler: { lvl: 1, tier: 1 },
        storage: { lvl: 1, tier: 1 }
      }
    });

    let st = load();
    function load() {
      try {
        const b = defState(), p = JSON.parse(localStorage.getItem(KEY) || "{}");
        return {
          ...b, ...p,
          inv: { ...b.inv, ...(p.inv || {}) },
          mod: {
            drill: { ...b.mod.drill, ...(p.mod?.drill || {}) },
            battery: { ...b.mod.battery, ...(p.mod?.battery || {}) },
            collector: { ...b.mod.collector, ...(p.mod?.collector || {}) },
            cooler: { ...b.mod.cooler, ...(p.mod?.cooler || {}) },
            storage: { ...b.mod.storage, ...(p.mod?.storage || {}) }
          }
        };
      } catch { return defState(); }
    }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };

    const fmtMass = (kg) => kg >= 1e9 ? `${(kg/1e9).toFixed(2)} млн т` : kg >= 1e6 ? `${(kg/1e6).toFixed(2)} тыс. т` : kg >= 1000 ? `${(kg/1000).toFixed(2)} т` : `${Math.round(kg).toLocaleString("ru-RU")} кг`;
    const fmtCoins = (n) => n >= 1e9 ? `${(n/1e9).toFixed(2)} млрд` : n >= 1e6 ? `${(n/1e6).toFixed(2)} млн` : n >= 1e4 ? `${(n/1e3).toFixed(1)} тыс.` : `${Math.floor(n).toLocaleString("ru-RU")}`;

    const batCapH = () => 4 * Math.pow(1.45, st.mod.battery.lvl - 1) * Math.pow(1.8, st.mod.battery.tier - 1);
    const motorFactor = () => Math.pow(2, st.mod.drill.lvl - 1) * Math.pow(1.6, st.mod.drill.tier - 1);
    const remWorkH = () => st.energy / Math.max(0.1, motorFactor());
    const maxWorkH = () => batCapH() / Math.max(0.1, motorFactor());
    const drainPerSec = () => (4.0 / (4 * 3600)) * motorFactor();
    const tapCharge = () => (0.15 + (st.mod.battery.lvl - 1) * 0.05) * Math.pow(1.5, st.mod.battery.tier - 1);
    const storCapKg = () => Math.round((5000 + (st.mod.storage.lvl - 1) * 2500) * Math.pow(3.5, st.mod.storage.tier - 1));
    const usedKg = () => Object.values(st.inv).reduce((a, b) => a + (b || 0), 0);
    const isFull = () => usedKg() >= storCapKg();
    const isBroken = () => st.brokenUntil > Date.now();
    const repairSec = () => Math.max(0.1, (st.brokenUntil - Date.now()) / 1000);
    const repairDur = () => Math.round(8 + ((st.mod.drill.lvl + (st.mod.drill.tier - 1) * 5) - 1) * 3.5);
    const sellMult = () => 1 + (st.mod.storage.tier - 1) * 0.2 + (st.mod.storage.lvl - 1) * 0.03;
    const colMult = () => 1 + (st.mod.collector.lvl - 1) * 0.3 + (st.mod.collector.tier - 1) * 0.9;
    const pwrRatio = () => (st.power || 100) / 100;

    function heatGainSec() {
      const c = st.mod.cooler;
      const red = Math.max(0.25, 1 - (c.lvl - 1) * 0.08 - (c.tier - 1) * 0.22);
      const base = 1.6 * red * (1 + (st.mod.drill.lvl - 1) * 0.14) * pwrRatio();
      return isFull() ? Math.max(4.2, base * 3.0) : base;
    }
    function coolSec() {
      const c = st.mod.cooler;
      const base = 6 + (c.lvl - 1) * 3 + (c.tier - 1) * 9;
      return isFull() && !isBroken() ? base * 0.2 : base;
    }

    const horizon = () => {
      let cur = HORIZONS[0];
      for (const h of HORIZONS) if (st.depth >= h.d) cur = h;
      return cur;
    };

    const resCoins = (r, kg) => Math.max(1, Math.round((kg / 1000) * r.perTon * sellMult()));

    const lvlCost = (k) => Math.round(({ drill: 25, battery: 25, collector: 35, cooler: 30, storage: 20 }[k] || 25) * Math.pow(1.45, st.mod[k].lvl - 1) * Math.pow(1.95, st.mod[k].tier - 1));
    const tierInfo = (k) => ({ req: st.mod[k].tier * 5, cost: Math.round(({ drill: 180, battery: 170, collector: 220, cooler: 200, storage: 160 }[k] || 180) * Math.pow(3.2, st.mod[k].tier - 1)) });

    function addMass(kgWant) {
      if (kgWant <= 0) return;
      const h = horizon(), free = Math.max(0, storCapKg() - usedKg());
      let r = Math.random(), acc = 0, pick = h.w[h.w.length - 1];
      for (const item of h.w) { acc += item[1]; if (r <= acc) { pick = item; break; } }
      const raw = Math.max(1, Math.round(kgWant * pick[2] * (0.85 + Math.random() * 0.35)));
      const take = Math.min(raw, free);
      if (take > 0) st.inv[pick[0]] = (st.inv[pick[0]] || 0) + take;
    }

    function render() {
      st.energy = Math.min(batCapH(), Math.max(0, st.energy));
      const h = horizon(), u = usedKg(), cap = storCapKg(), full = isFull(), brk = isBroken();
      const rem = remWorkH(), maxH = maxWorkH(), batPct = Math.max(0, Math.min(100, (st.energy / Math.max(0.01, batCapH())) * 100));
      const active = !brk && !st.overheated && !st.manualOff && st.energy > 0;

      document.getElementById("sCoins").textContent = fmtCoins(st.coins);
      document.getElementById("sDepth").textContent = `${st.depth.toFixed(1)} м`;
      document.getElementById("sBat").textContent = `${rem.toFixed(1)} ч`;
      const sStor = document.getElementById("sStor");
      sStor.textContent = `${fmtMass(u)}/${fmtMass(cap)}`;
      sStor.className = full ? "val red" : "val grn";

      document.getElementById("lBat").textContent = `Батарея: ${rem.toFixed(1)} / ${maxH.toFixed(1)} ч (×${motorFactor().toFixed(1)})`;
      document.getElementById("pBat").textContent = `${Math.round(batPct)}%`;
      document.getElementById("bBat").style.width = `${batPct}%`;

      const hp = Math.round(st.heat);
      document.getElementById("pHeat").textContent = `${hp}%`;
      document.getElementById("bHeat").style.width = `${hp}%`;
      document.getElementById("lHeat").textContent = brk ? `Сломан (${repairSec().toFixed(1)}с)` : st.manualOff ? "Бур отрублен" : st.overheated ? "Перегрев! Остывает..." : full ? "Склад 100%! Греет быстрее" : "Нагрев: Норма";

      const warn = document.getElementById("warnBox");
      if (brk) { warn.classList.remove("hidden"); warn.textContent = `Бур сломан из-за перегрева при полном складе! Починка: ${repairSec().toFixed(1)} сек`; }
      else if (st.manualOff) { warn.classList.remove("hidden"); warn.textContent = "Бур отрублен вручную — мотор остывает."; }
      else if (st.energy <= 0) { warn.classList.remove("hidden"); warn.textContent = "Нет заряда. Тапайте по сцене для зарядки."; }
      else if (full) { warn.classList.remove("hidden"); warn.textContent = "Склад заполнен на 100%! Нагрев идёт быстрее."; }
      else warn.classList.add("hidden");

      const kgSec = h.kg * motorFactor() * colMult() * pwrRatio() * (1 + st.depth / 250);
      document.getElementById("groundTxt").textContent = `${h.name} • ~${fmtMass(kgSec)}/сек`;
      document.getElementById("rig").classList.toggle("spin", active);

      const tBtn = document.getElementById("toggleDrillBtn");
      tBtn.textContent = st.manualOff ? "⚡ ВКЛЮЧИТЬ БУР" : "🔌 ОТРУБИТЬ БУР";
      tBtn.classList.toggle("is-off", st.manualOff);

      document.getElementById("pwrSlider").value = String(st.power);
      document.getElementById("pwrVal").textContent = `${st.power}%`;
      document.getElementById("pwrInfo").textContent = `Нагрев ×${pwrRatio().toFixed(2)} • АКБ 100%`;

      // Инвентарь
      let sum = 0;
      RES.forEach((r) => { if (st.inv[r.id] > 0) sum += resCoins(r, st.inv[r.id]); });
      document.getElementById("invCap").textContent = `Склад: ${fmtMass(u)} / ${fmtMass(cap)}`;
      document.getElementById("invSum").textContent = `Сумма: ${fmtCoins(sum)}`;
      document.getElementById("sellAllBtn").disabled = u <= 0;

      const invList = document.getElementById("invList");
      invList.innerHTML = "";
      RES.forEach((r) => {
        const kg = st.inv[r.id] || 0;
        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = `<div><div><strong>${r.icon} ${r.name}</strong></div><div class="sub">${Math.round(r.perTon * sellMult())} / т</div></div><div style="display:flex;align-items:center;gap:8px;"><strong>${fmtMass(kg)}</strong><button class="sell" ${kg <= 0 ? "disabled" : ""}>Забрать</button></div>`;
        el.querySelector("button").onclick = () => { st.coins += resCoins(r, kg); st.inv[r.id] = 0; save(); render(); };
        invList.appendChild(el);
      });

      // Модули
      const mods = [
        ["drill", "⛏️ Бур и мотор", `Мощность ×${motorFactor().toFixed(1)} • Ход: ${maxWorkH().toFixed(1)} ч • Починка ${repairDur()}с`],
        ["battery", "🔋 Батарея", `Ёмкость ${batCapH().toFixed(1)} ч • Тап +${tapCharge().toFixed(2)} ч`],
        ["collector", "📦 Сборник", `Добыча ×${colMult().toFixed(2)}`],
        ["cooler", "❄️ Охлаждение", `Нагрев +${heatGainSec().toFixed(1)}%/с • Охлад ${coolSec().toFixed(0)}%/с`],
        ["storage", "🗄️ Хранилище", `Объём ${fmtMass(cap)} • Наценка +${Math.round((sellMult() - 1) * 100)}%`]
      ];
      const modList = document.getElementById("modList");
      modList.innerHTML = "";
      mods.forEach(([k, title, desc]) => {
        const m = st.mod[k], lc = lvlCost(k), ti = tierInfo(k);
        const card = document.createElement("div");
        card.className = "item";
        card.style.flexDirection = "column";
        card.style.alignItems = "stretch";
        card.innerHTML = `<div style="display:flex;justify-content:space-between;"><strong>${title} (Ур.${m.lvl})</strong><span class="sub">ТИР ${m.tier}</span></div><div class="sub" style="margin-top:3px;">${desc}</div><div class="m-act"><button class="btn u-lvl" ${st.coins >= lc ? "" : "disabled"}>Ур. (${fmtCoins(lc)})</button><button class="btn u-tier" ${m.level >= ti.req && st.coins >= ti.cost ? "" : "disabled"}>Тир ${m.tier + 1} с ${ti.req} ур. (${fmtCoins(ti.cost)})</button></div>`;
        const [b1, b2] = card.querySelectorAll("button");
        b1.onclick = () => { if (st.coins < lc) return; st.coins -= lc; m.lvl += 1; save(); render(); };
        b2.onclick = () => { if (m.lvl < ti.req || st.coins < ti.cost) return; st.coins -= ti.cost; m.tier += 1; save(); render(); };
        modList.appendChild(card);
      });
    }

    document.getElementById("toggleDrillBtn").onclick = () => { st.manualOff = !st.manualOff; save(); render(); };
    document.getElementById("pwrSlider").oninput = (e) => { st.power = Number(e.target.value); save(); render(); };
    document.getElementById("stage").onclick = () => { st.energy = Math.min(batCapH(), st.energy + tapCharge()); save(); render(); };
    document.getElementById("sellAllBtn").onclick = () => {
      RES.forEach((r) => { if (st.inv[r.id] > 0) { st.coins += resCoins(r, st.inv[r.id]); st.inv[r.id] = 0; } });
      save(); render();
    };
    document.getElementById("resetBtn").onclick = () => { st = defState(); save(); render(); };
    document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
      document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
      t.classList.add("active");
      ["drill", "inv", "mod"].forEach((p) => document.getElementById(`p-${p}`).classList.toggle("hidden", p !== t.dataset.p));
    });

    let tick = 0;
    setInterval(() => {
      const dt = 0.25; tick++;
      if (st.brokenUntil > 0 && Date.now() >= st.brokenUntil) { st.brokenUntil = 0; st.overheated = false; st.heat = 0; save(); }
      if (!isBroken()) {
        const active = !st.overheated && !st.manualOff && st.energy > 0;
        const fullBefore = isFull();
        if (active) {
          st.energy = Math.max(0, st.energy - drainPerSec() * dt);
          st.heat = Math.min(100, st.heat + heatGainSec() * dt);
          if (st.heat >= 100) {
            if (fullBefore) { st.brokenUntil = Date.now() + repairDur() * 1000; st.overheated = true; st.heat = 100; }
            else st.overheated = true;
          }
          const h = horizon();
          st.depth = Number((st.depth + h.v * pwrRatio() * dt).toFixed(1));
          addMass(h.kg * motorFactor() * colMult() * pwrRatio() * (1 + st.depth / 250) * dt);
        } else if (st.heat > 0) {
          st.heat = Math.max(0, st.heat - coolSec() * dt);
          if (st.overheated && st.heat <= 20) st.overheated = false;
        }
      }
      if (tick % 4 === 0) save();
      render();
    }, 250);

    render();
  </script>
</body>
</html>
