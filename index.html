<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burenie Clicker</title>
    <!-- Подключение официального скрипта Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0f1115;
            --panel-bg: #181c24;
            --panel-border: #2a3140;
            --accent-gold: #f59e0b;
            --accent-orange: #ea580c;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background 0.8s ease;
        }

        /* Верхняя панель статистики */
        .header {
            padding: 12px 16px;
            background: rgba(24, 28, 36, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--panel-border);
            z-index: 10;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .stat-box {
            background: rgba(15, 17, 21, 0.7);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 8px 14px;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-icon {
            font-size: 20px;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
        }

        .stat-value.coins {
            color: var(--accent-gold);
        }

        /* Индикатор слоя породы */
        .layer-card {
            background: rgba(15, 17, 21, 0.7);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 8px 12px;
        }

        .layer-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .layer-name {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .layer-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #1f2430;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 99px;
            transition: width 0.15s ease-out, background 0.5s ease;
        }

        /* Центральная зона бурения */
        .drill-arena {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Декоративные стенки шахты */
        .shaft-walls {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: 
                linear-gradient(90deg, rgba(0,0,0,0.65) 0%, transparent 18%, transparent 82%, rgba(0,0,0,0.65) 100%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 24px);
        }

        .drill-wrapper {
            position: relative;
            width: 190px;
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.08s ease;
            z-index: 2;
        }

        .drill-wrapper:active {
            transform: scale(0.95) translateY(6px);
        }

        .drill-wrapper.shaking {
            animation: drillShake 0.12s infinite;
        }

        @keyframes drillShake {
            0% { transform: translate(-2px, 2px) scale(0.97); }
            50% { transform: translate(2px, 5px) scale(0.96); }
            100% { transform: translate(-1px, 3px) scale(0.97); }
        }

        .drill-svg {
            width: 165px;
            height: 200px;
            filter: drop-shadow(0 12px 24px rgba(0,0,0,0.7));
        }

        /* Анимация вращения лопастей шнека */
        .drill-blades {
            transform-origin: center;
            transition: opacity 0.2s;
        }

        .drilling-active .drill-blades {
            animation: bladeSpin 0.18s linear infinite;
        }

        @keyframes bladeSpin {
            0% { transform: translateY(-4px); }
            50% { transform: translateY(4px); }
            100% { transform: translateY(-4px); }
        }

        .tap-hint {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(0, 0, 0, 0.35);
            padding: 5px 12px;
            border-radius: 99px;
            pointer-events: none;
            z-index: 2;
        }

        /* Шкала перегрева */
        .heat-container {
            width: 85%;
            max-width: 340px;
            margin-top: 14px;
            z-index: 2;
            pointer-events: none;
        }

        .heat-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .heat-track {
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 99px;
            overflow: hidden;
        }

        .heat-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #06b6d4, #f59e0b, #ef4444);
            border-radius: 99px;
            transition: width 0.1s linear;
        }

        .overheated-badge {
            display: none;
            position: absolute;
            top: 20px;
            background: rgba(239, 68, 68, 0.95);
            color: white;
            font-weight: 800;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 99px;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.5);
            animation: pulseAlert 0.6s infinite alternate;
            z-index: 5;
        }

        .overheated-badge.visible {
            display: block;
        }

        @keyframes pulseAlert {
            from { transform: scale(0.96); }
            to { transform: scale(1.04); }
        }

        /* Всплывающие цифры и частицы */
        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 18px;
            color: #fbbf24;
            text-shadow: 0 2px 6px rgba(0,0,0,0.85);
            pointer-events: none;
            z-index: 15;
            animation: floatUp 0.75s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            30% { transform: translate(-50%, -18px) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -55px) scale(0.95); }
        }

        .particle {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 12;
        }

        /* Нижняя панель магазина улучшений */
        .shop-panel {
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            border-radius: 20px 20px 0 0;
            padding: 12px 14px 18px;
            z-index: 10;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.45);
        }

        .shop-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .auto-income-badge {
            font-size: 11px;
            color: #34d399;
            background: rgba(16, 185, 129, 0.15);
            padding: 3px 8px;
            border-radius: 99px;
            text-transform: none;
        }

        .upgrades-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .upgrade-btn {
            background: #222733;
            border: 1px solid #323a4b;
            border-radius: 14px;
            padding: 10px 8px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .upgrade-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .upgrade-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .upgrade-btn.affordable {
            border-color: rgba(245, 158, 11, 0.65);
            background: linear-gradient(180deg, #272d3d 0%, #222631 100%);
        }

        .upg-icon {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .upg-name {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .upg-lvl {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .upg-cost {
            font-size: 12px;
            font-weight: 800;
            color: var(--accent-gold);
            background: rgba(0, 0, 0, 0.35);
            padding: 3px 8px;
            border-radius: 8px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Верхняя панель: Монеты, Глубина и Слой породы -->
    <header class="header">
        <div class="stats-row">
            <div class="stat-box">
                <span class="stat-icon">🪙</span>
                <div class="stat-info">
                    <span class="stat-label">Баланс</span>
                    <span class="stat-value coins" id="coinsDisplay">0</span>
                </div>
            </div>
            <div class="stat-box">
                <span class="stat-icon">📏</span>
                <div class="stat-info">
                    <span class="stat-label">Глубина</span>
                    <span class="stat-value" id="depthDisplay">0 м</span>
                </div>
            </div>
        </div>

        <div class="layer-card">
            <div class="layer-header">
                <span class="layer-name">
                    <span class="layer-dot" id="layerDot" style="background: #8b5a2b;"></span>
                    <span id="layerName">Слой 1: Чернозём</span>
                </span>
                <span id="layerHpText">100 / 100</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="layerProgress"></div>
            </div>
        </div>
    </header>

    <!-- Центральная интерактивная область бурения -->
    <main class="drill-arena" id="drillArena">
        <div class="shaft-walls"></div>

        <div class="overheated-badge" id="overheatBadge">🔥 ПЕРЕГРЕВ! ОСТЫВАНИЕ...</div>

        <div class="drill-wrapper" id="drillWrapper">
            <!-- Векторная графика промышленного бура -->
            <svg class="drill-svg" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Верхняя гидравлическая платформа -->
                <rect x="45" y="10" width="110" height="24" rx="6" fill="#374151" stroke="#6B7280" stroke-width="3"/>
                <rect x="65" y="34" width="70" height="32" rx="4" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
                <!-- Предупреждающие полосы -->
                <path d="M75 34L65 66M95 34L85 66M115 34L105 66M135 34L125 66" stroke="#1F2937" stroke-width="5"/>
                <!-- Редуктор -->
                <rect x="55" y="66" width="90" height="22" rx="5" fill="#4B5563" stroke="#9CA3AF" stroke-width="2"/>
                
                <!-- Основной конус шнека -->
                <polygon points="62,88 138,88 100,225" fill="url(#drillMetal)" stroke="#4B5563" stroke-width="3"/>
                
                <!-- Спиральные лопасти бура -->
                <g class="drill-blades">
                    <path d="M56 105 L144 118 L140 130 L58 117 Z" fill="#F59E0B" stroke="#92400E" stroke-width="2"/>
                    <path d="M66 138 L134 150 L130 161 L69 149 Z" fill="#F59E0B" stroke="#92400E" stroke-width="2"/>
                    <path d="M77 170 L123 180 L119 190 L80 180 Z" fill="#F59E0B" stroke="#92400E" stroke-width="2"/>
                    <path d="M88 198 L112 205 L108 213 L91 206 Z" fill="#EF4444"/>
                </g>

                <!-- Блики металла -->
                <line x1="82" y1="92" x2="96" y2="210" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round"/>

                <defs>
                    <linearGradient id="drillMetal" x1="62" y1="88" x2="138" y2="88" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#374151"/>
                        <stop offset="45%" stop-color="#9CA3AF"/>
                        <stop offset="100%" stop-color="#1F2937"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="tap-hint" id="tapHint">Нажимай по экрану, чтобы бурить!</div>

        <!-- Индикатор температуры бура -->
        <div class="heat-container">
            <div class="heat-label-row">
                <span>🌡️ Температура бура</span>
                <span id="heatText">0%</span>
            </div>
            <div class="heat-track">
                <div class="heat-fill" id="heatFill"></div>
            </div>
        </div>
    </main>

    <!-- Магазин улучшений -->
    <section class="shop-panel">
        <div class="shop-title">
            <span>⚙️ Улучшения бура</span>
            <span class="auto-income-badge" id="autoIncomeBadge">Авто: 0/сек</span>
        </div>

        <div class="upgrades-grid">
            <button class="upgrade-btn" id="upgPowerBtn">
                <span class="upg-icon">⛏️</span>
                <span class="upg-name">Мощность</span>
                <span class="upg-lvl" id="powerLvlText">Ур. 1 (+1)</span>
                <span class="upg-cost" id="powerCostText">🪙 15</span>
            </button>

            <button class="upgrade-btn" id="upgCoolBtn">
                <span class="upg-icon">❄️</span>
                <span class="upg-name">Охлаждение</span>
                <span class="upg-lvl" id="coolLvlText">Ур. 1</span>
                <span class="upg-cost" id="coolCostText">🪙 25</span>
            </button>

            <button class="upgrade-btn" id="upgAutoBtn">
                <span class="upg-icon">🤖</span>
                <span class="upg-name">Авто-бур</span>
                <span class="upg-lvl" id="autoLvlText">Ур. 0</span>
                <span class="upg-cost" id="autoCostText">🪙 50</span>
            </button>
        </div>
    </section>

    <script>
        // Инициализация Telegram WebApp API
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand(); // Разворачиваем игру на весь экран в Telegram
            try {
                tg.setHeaderColor('#0f1115');
                tg.setBackgroundColor('#0f1115');
            } catch (e) {}
        }

        // Конфигурация подземных слоёв
        const LAYERS = [
            { name: "Чернозём", color: "#78350f", bg: "#1c140d", baseHp: 60, rewardMult: 1 },
            { name: "Плотная глина", color: "#b45309", bg: "#23170d", baseHp: 150, rewardMult: 2 },
            { name: "Известняк", color: "#9ca3af", bg: "#1c1f24", baseHp: 350, rewardMult: 4 },
            { name: "Гранит", color: "#64748b", bg: "#151922", baseHp: 800, rewardMult: 7 },
            { name: "Базальт", color: "#3b82f6", bg: "#0f172a", baseHp: 1800, rewardMult: 12 },
            { name: "Магма", color: "#ef4444", bg: "#280d0d", baseHp: 4000, rewardMult: 20 },
            { name: "Ядро Земли", color: "#f59e0b", bg: "#2b1905", baseHp: 10000, rewardMult: 35 }
        ];

        // Состояние игры (загружается из localStorage)
        let state = {
            coins: 0,
            depth: 0,
            layerIndex: 0,
            layerHp: 60,
            layerMaxHp: 60,
            powerLvl: 1,
            coolLvl: 1,
            autoLvl: 0,
            heat: 0,
            isOverheated: false
        };

        // Загрузка сохранения
        function loadGame() {
            try {
                const saved = localStorage.getItem('burenie_clicker_save_v1');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed, heat: 0, isOverheated: false };
                }
            } catch (e) {
                console.warn('Не удалось загрузить сохранение:', e);
            }
        }

        function saveGame() {
            try {
                localStorage.setItem('burenie_clicker_save_v1', JSON.stringify(state));
            } catch (e) {}
        }

        // Расчёт характеристик от уровней
        function getDrillPower() {
            return Math.floor(state.powerLvl * (1 + (state.powerLvl - 1) * 0.25));
        }

        function getPowerCost() {
            return Math.floor(15 * Math.pow(1.45, state.powerLvl - 1));
        }

        function getCoolCost() {
            return Math.floor(25 * Math.pow(1.55, state.coolLvl - 1));
        }

        function getAutoCost() {
            return Math.floor(50 * Math.pow(1.6, state.autoLvl));
        }

        function getAutoDps() {
            if (state.autoLvl === 0) return 0;
            return Math.floor(state.autoLvl * 2 * (1 + state.autoLvl * 0.15));
        }

        // Форматирование больших чисел
        function formatNum(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e4) return (num / 1e3).toFixed(1) + 'K';
            return Math.floor(num).toString();
        }

        // Вибрация при нажатии в Telegram
        function triggerHaptic(style = 'light') {
            if (tg && tg.HapticFeedback) {
                try {
                    tg.HapticFeedback.impactOccurred(style);
                } catch (e) {}
            }
        }

        // DOM-элементы
        const coinsDisplay = document.getElementById('coinsDisplay');
        const depthDisplay = document.getElementById('depthDisplay');
        const layerDot = document.getElementById('layerDot');
        const layerName = document.getElementById('layerName');
        const layerHpText = document.getElementById('layerHpText');
        const layerProgress = document.getElementById('layerProgress');
        const drillArena = document.getElementById('drillArena');
        const drillWrapper = document.getElementById('drillWrapper');
        const heatFill = document.getElementById('heatFill');
        const heatText = document.getElementById('heatText');
        const overheatBadge = document.getElementById('overheatBadge');
        const autoIncomeBadge = document.getElementById('autoIncomeBadge');

        const upgPowerBtn = document.getElementById('upgPowerBtn');
        const upgCoolBtn = document.getElementById('upgCoolBtn');
        const upgAutoBtn = document.getElementById('upgAutoBtn');

        let spinTimeout = null;

        // Основная логика нанесения урона породе
        function mineRock(damage, isManual = true, clickX = null, clickY = null) {
            const currentLayer = LAYERS[state.layerIndex % LAYERS.length];
            const cycleMultiplier = Math.floor(state.layerIndex / LAYERS.length) + 1;

            state.layerHp -= damage;
            const earnedCoins = Math.max(1, Math.round((damage * 0.6) * currentLayer.rewardMult));
            state.coins += earnedCoins;

            // Визуальные эффекты при ручном клике
            if (isManual && clickX !== null && clickY !== null) {
                spawnFloatingText(clickX, clickY, `+${formatNum(earnedCoins)} 🪙`);
                spawnParticles(clickX, clickY, currentLayer.color);
            }

            // Проверка пробития текущего слоя
            if (state.layerHp <= 0) {
                state.depth += 10;
                state.layerIndex += 1;
                const nextLayer = LAYERS[state.layerIndex % LAYERS.length];
                const nextCycle = Math.floor(state.layerIndex / LAYERS.length) + 1;
                state.layerMaxHp = Math.floor(nextLayer.baseHp * Math.pow(2.2, nextCycle - 1));
                state.layerHp = state.layerMaxHp;

                // Бонус за прохождение слоя
                const depthBonus = earnedCoins * 5;
                state.coins += depthBonus;
                if (isManual) {
                    triggerHaptic('heavy');
                    const rect = drillArena.getBoundingClientRect();
                    spawnFloatingText(rect.width / 2, rect.height / 2 - 40, `ГЛУБЖЕ! +${formatNum(depthBonus)} 🪙`);
                }
            }

            updateUI();
        }

        // Обработка нажатия по буру
        function handleDrillTap(e) {
            if (state.isOverheated) {
                triggerHaptic('rigid');
                return;
            }

            // Определяем координаты нажатия
            const rect = drillArena.getBoundingClientRect();
            let clientX = rect.left + rect.width / 2;
            let clientY = rect.top + rect.height / 2;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.clientX !== undefined) {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const relX = clientX - rect.left;
            const relY = clientY - rect.top;

            // Нагрев бура (уменьшается с прокачкой охлаждения)
            const heatPerTap = Math.max(2.2, 8.5 - (state.coolLvl - 1) * 0.65);
            state.heat = Math.min(100, state.heat + heatPerTap);

            if (state.heat >= 100) {
                state.isOverheated = true;
                overheatBadge.classList.add('visible');
                triggerHaptic('error');
            } else {
                triggerHaptic('medium');
            }

            // Анимация вибрации и вращения бура
            drillWrapper.classList.add('drilling-active', 'shaking');
            clearTimeout(spinTimeout);
            spinTimeout = setTimeout(() => {
                drillWrapper.classList.remove('drilling-active', 'shaking');
            }, 220);

            mineRock(getDrillPower(), true, relX, relY);
        }

        // Всплывающий текст монет
        function spawnFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = `${x + (Math.random() * 24 - 12)}px`;
            el.style.top = `${y - 10}px`;
            drillArena.appendChild(el);
            setTimeout(() => el.remove(), 750);
        }

        // Разлетающиеся осколки породы
        function spawnParticles(x, y, color) {
            for (let i = 0; i < 6; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.backgroundColor = i % 2 === 0 ? color : '#fbbf24';
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                drillArena.appendChild(p);

                const angle = (Math.PI * 2 * i) / 6 + (Math.random() * 0.5);
                const velocity = 35 + Math.random() * 45;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity - 20;

                p.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0.2)`, opacity: 0 }
                ], {
                    duration: 450,
                    easing: 'ease-out'
                }).onfinish = () => p.remove();
            }
        }

        // Покупка улучшений
        upgPowerBtn.addEventListener('click', () => {
            const cost = getPowerCost();
            if (state.coins >= cost) {
                state.coins -= cost;
                state.powerLvl += 1;
                triggerHaptic('light');
                saveGame();
                updateUI();
            }
        });

        upgCoolBtn.addEventListener('click', () => {
            const cost = getCoolCost();
            if (state.coins >= cost) {
                state.coins -= cost;
                state.coolLvl += 1;
                state.heat = Math.max(0, state.heat - 30);
                triggerHaptic('light');
                saveGame();
                updateUI();
            }
        });

        upgAutoBtn.addEventListener('click', () => {
            const cost = getAutoCost();
            if (state.coins >= cost) {
                state.coins -= cost;
                state.autoLvl += 1;
                triggerHaptic('light');
                saveGame();
                updateUI();
            }
        });

        // Привязка событий касания и клика
        drillArena.addEventListener('pointerdown', handleDrillTap);

        // Обновление интерфейса
        function updateUI() {
            const currentLayer = LAYERS[state.layerIndex % LAYERS.length];
            const cycle = Math.floor(state.layerIndex / LAYERS.length) + 1;

            coinsDisplay.textContent = formatNum(state.coins);
            depthDisplay.textContent = `${formatNum(state.depth)} м`;

            layerDot.style.background = currentLayer.color;
            layerName.textContent = `Слой ${state.layerIndex + 1}: ${currentLayer.name}${cycle > 1 ? ` (x${cycle})` : ''}`;
            layerHpText.textContent = `${formatNum(Math.max(0, state.layerHp))} / ${formatNum(state.layerMaxHp)}`;

            const hpPercent = Math.max(0, Math.min(100, (state.layerHp / state.layerMaxHp) * 100));
            layerProgress.style.width = `${hpPercent}%`;
            layerProgress.style.background = currentLayer.color;
            document.body.style.backgroundColor = currentLayer.bg;

            // Температура
            heatFill.style.width = `${state.heat}%`;
            heatText.textContent = `${Math.round(state.heat)}%`;

            // Кнопки магазина
            const pCost = getPowerCost();
            document.getElementById('powerLvlText').textContent = `Ур. ${state.powerLvl} (+${formatNum(getDrillPower())})`;
            document.getElementById('powerCostText').textContent = `🪙 ${formatNum(pCost)}`;
            upgPowerBtn.disabled = state.coins < pCost;
            upgPowerBtn.classList.toggle('affordable', state.coins >= pCost);

            const cCost = getCoolCost();
            document.getElementById('coolLvlText').textContent = `Ур. ${state.coolLvl}`;
            document.getElementById('coolCostText').textContent = `🪙 ${formatNum(cCost)}`;
            upgCoolBtn.disabled = state.coins < cCost;
            upgCoolBtn.classList.toggle('affordable', state.coins >= cCost);

            const aCost = getAutoCost();
            const autoDps = getAutoDps();
            document.getElementById('autoLvlText').textContent = `Ур. ${state.autoLvl}`;
            document.getElementById('autoCostText').textContent = `🪙 ${formatNum(aCost)}`;
            upgAutoBtn.disabled = state.coins < aCost;
            upgAutoBtn.classList.toggle('affordable', state.coins >= aCost);

            autoIncomeBadge.textContent = `Авто-бур: ${formatNum(autoDps)}/сек`;
        }

        // Игровой цикл: охлаждение бура (10 раз в секунду)
        setInterval(() => {
            if (state.heat > 0) {
                const coolRate = state.isOverheated
                    ? (3.2 + state.coolLvl * 0.35) // Остывание при перегреве (~3 сек)
                    : (1.8 + state.coolLvl * 0.4);
                state.heat = Math.max(0, state.heat - coolRate);

                if (state.isOverheated && state.heat <= 15) {
                    state.isOverheated = false;
                    overheatBadge.classList.remove('visible');
                }
                heatFill.style.width = `${state.heat}%`;
                heatText.textContent = `${Math.round(state.heat)}%`;
            }
        }, 100);

        // Игровой цикл: работа авто-бура и автосохранение (раз в секунду)
        setInterval(() => {
            const dps = getAutoDps();
            if (dps > 0) {
                mineRock(dps, false);
            }
            saveGame();
        }, 1000);

        // Запуск при загрузке
        window.addEventListener('load', () => {
            loadGame();
            updateUI();
        });
    </script>
</body>
</html>
