<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Глубинный Кликер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #141210;
      --panel: #221d1a;
      --panel-2: #2c2521;
      --border: #463b34;
      --text: #faf7f5;
      --muted: #b8aea6;
      --gold: #f59e0b;
      --orange: #ea580c;
      --cyan: #38bdf8;
      --green: #22c55e;
      --green-light: #4ade80;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100%;
    }

    body {
      padding-bottom: 84px;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      background: #191512;
      box-shadow: 0 0 36px rgba(0, 0, 0, 0.65);
    }

    .hidden {
      display: none !important;
    }

    /* Верхняя панель */
    .top-hud {
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(180deg, #2d2118 0%, #1c1510 100%);
      border-bottom: 2px solid var(--border);
      padding: 10px 12px;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .energy-wrap {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .energy-track {
      position: relative;
      flex: 1;
      height: 22px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .energy-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      transition: width 0.14s ease-out;
    }

    .energy-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      font-variant-numeric: tabular-nums;
    }

    .refill-btn {
      background: linear-gradient(180deg, #fb923c, #ea580c);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 #9a3412;
      white-space: nowrap;
    }

    .refill-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #9a3412;
    }

    .alert-box {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .alert-box.warn {
      background: rgba(2, 132, 199, 0.22);
      border: 1px solid rgba(56, 189, 248, 0.6);
      color: #bae6fd;
    }

    .alert-box.full {
      background: rgba(220, 38, 38, 0.24);
      border: 1px solid rgba(248, 113, 113, 0.7);
      color: #fecaca;
    }

    /* Главный экран кликера */
    .clicker-screen {
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .vein-card {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .vein-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .vein-bar {
      height: 10px;
      background: #120e0c;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #3b312b;
    }

    .vein-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      transition: width 0.2s ease;
    }

    .tap-arena {
      position: relative;
      width: 100%;
      min-height: 290px;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 42%, rgba(245, 158, 11, 0.16), transparent 62%),
        linear-gradient(180deg, #2b1b12 0%, #1d130d 100%);
      border: 2px solid #523828;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
      overflow: hidden;
    }

    .rock-tap-btn {
      width: 166px;
      height: 166px;
      border-radius: 36px;
      border: 3px solid #78350f;
      background: linear-gradient(165deg, #4b382f 0%, #2b1f1a 65%, #1c1411 100%);
      box-shadow:
        0 10px 0 #120c0a,
        0 16px 28px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.07s ease, box-shadow 0.07s ease;
    }

    .rock-tap-btn:active {
      transform: translateY(6px) scale(0.97);
      box-shadow:
        0 4px 0 #120c0a,
        0 8px 16px rgba(0, 0, 0, 0.55);
    }

    .rock-tap-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .tap-caption {
      font-size: 13px;
      font-weight: 900;
      color: #fde68a;
    }

    .tap-sub {
      font-size: 11px;
      font-weight: 700;
      color: #d6c7bc;
    }

    .float-popup {
      position: absolute;
      pointer-events: none;
      font-size: 14px;
      font-weight: 900;
      color: #fde047;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
      animation: popUp 0.85s ease-out forwards;
    }

    @keyframes popUp {
      0% {
        opacity: 1;
        transform: translate(-50%, 0) scale(0.95);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -58px) scale(1.08);
      }
    }

    .rates-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .rate-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }

    .rate-title {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
    }

    .rate-val {
      margin-top: 3px;
      font-size: 14px;
      font-weight: 900;
      color: #fef08a;
    }

    /* Улучшения */
    .list-wrap {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .upgrade-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .upgrade-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .upgrade-name {
      font-size: 15px;
      font-weight: 900;
    }

    .lvl-badge {
      background: #332a25;
      border: 1px solid #5c4c42;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 900;
      color: #fde68a;
    }

    .upgrade-effect {
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    .upgrade-btn {
      margin-top: 10px;
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(180deg, var(--green-light), var(--green));
      color: #052e16;
    }

    .upgrade-btn.res-mode {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: #062030;
    }

    .upgrade-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Склад */
    .storage-top {
      background: #15803d;
      border-bottom: 2px solid #166534;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .sell-all-btn {
      background: #fef08a;
      color: #14532d;
      border: 2px solid #eab308;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .sell-all-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .ore-card {
      background: #f5f5f4;
      color: #1c1917;
      border-radius: 12px;
      padding: 11px;
      border: 1px solid #d6d3d1;
    }

    .ore-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ore-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: #e7e5e4;
      border: 1px solid #a8a29e;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ore-title {
      font-size: 14px;
      font-weight: 900;
    }

    .ore-price {
      margin-left: auto;
      font-size: 11px;
      font-weight: 800;
      color: #57534e;
    }

    .ore-foot {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .ore-kg {
      font-size: 14px;
      font-weight: 900;
      color: #15803d;
    }

    .sell-one-btn {
      background: linear-gradient(180deg, var(--green-light), var(--green));
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .sell-one-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .footer-reset {
      display: flex;
      justify-content: flex-end;
      padding: 4px 12px 12px;
    }

    .reset-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 11px;
      cursor: pointer;
    }

    /* Нижнее меню */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: rgba(20, 18, 16, 0.96);
      border-top: 2px solid var(--border);
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    }

    .nav-grid {
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .nav-btn {
      background: #26211e;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 9px;
      padding: 9px 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-btn.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-hud">
      <div class="hud-row">
        <div class="stat-chip">🪙 <span id="hudCoins">0</span></div>
        <div class="stat-chip">⛏️ Ур. <span id="hudRigLvl">1</span></div>
        <div class="stat-chip" id="hudStorage">0 / 2 000 кг</div>
      </div>

      <div class="energy-wrap">
        <div class="energy-track">
          <div class="energy-fill" id="energyFill"></div>
          <div class="energy-label" id="energyLabel">100 / 100</div>
        </div>
        <button class="refill-btn" id="refillBtn" type="button">⚡ Заряд</button>
      </div>

      <div class="alert-box hidden" id="alertBox"></div>
    </header>

    <!-- Экран 1: Кликер -->
    <section id="view-clicker">
      <div class="clicker-screen">
        <div class="vein-card">
          <div class="vein-top">
            <span id="layerTitle">Слой 1 • Поверхность</span>
            <span id="layerProgressText">0 / 5 000 кг</span>
          </div>
          <div class="vein-bar">
            <div class="vein-bar-fill" id="layerBarFill"></div>
          </div>
        </div>

        <div class="tap-arena" id="tapArena">
          <button class="rock-tap-btn" id="tapRockBtn" type="button">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
              <polygon points="14,48 10,24 26,10 50,16 54,42 36,54" fill="#9ca3af" stroke="#1f2937" stroke-width="3.5" />
              <polygon points="26,10 50,16 34,28 20,22" fill="#d1d5db" opacity="0.65" />
              <circle cx="38" cy="36" r="5" fill="#fbbf24" />
            </svg>
            <span class="tap-caption">ДОБЫТЬ ПОРОДУ</span>
            <span class="tap-sub" id="tapPowerHint">+25 кг за клик</span>
          </button>
        </div>

        <div class="rates-grid">
          <div class="rate-box">
            <div class="rate-title">За клик</div>
            <div class="rate-val" id="statTap">+25 кг</div>
          </div>
          <div class="rate-box">
            <div class="rate-title">Автодобыча</div>
            <div class="rate-val" id="statAuto">+10 кг/сек</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Экран 2: Улучшения -->
    <section class="hidden" id="view-upgrades">
      <div class="list-wrap" id="upgradesList"></div>
      <div class="footer-reset">
        <button class="reset-btn" id="resetBtn" type="button">Сбросить прогресс</button>
      </div>
    </section>

    <!-- Экран 3: Склад -->
    <section class="hidden" id="view-storage">
      <div class="storage-top">
        <strong style="font-size: 14px;" id="storageSummary">Склад</strong>
        <button class="sell-all-btn" id="sellAllBtn" type="button">Продать всё</button>
      </div>
      <div class="list-wrap" id="storageList"></div>
    </section>
  </div>

  <nav class="bottom-nav">
    <div class="nav-grid">
      <button class="nav-btn active" data-view="clicker" type="button">⛏️ Кликер</button>
      <button class="nav-btn" data-view="upgrades" type="button">⬆️ Улучшения</button>
      <button class="nav-btn" data-view="storage" type="button">📦 Склад</button>
    </div>
  </nav>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const SAVE_KEY = "deep_clicker_save_v1";

    const ORES = [
      { id: "dirt", name: "Земля", pricePerTon: 15, color: "#9a3412", accent: "#c2410c" },
      { id: "stone", name: "Камень", pricePerTon: 35, color: "#9ca3af", accent: "#4b5563" },
      { id: "coal", name: "Уголь", pricePerTon: 75, color: "#334155", accent: "#64748b" },
      { id: "iron", name: "Железная руда", pricePerTon: 155, color: "#78716c", accent: "#e7e5e4" },
      { id: "gold", name: "Золотая руда", pricePerTon: 340, color: "#854d0e", accent: "#facc15" }
    ];

    const LAYERS = [
      { title: "Слой 1 • Поверхность", targetKg: 5000, pool: [["dirt", 0.72], ["stone", 0.28]] },
      { title: "Слой 2 • Каменный пласт", targetKg: 18000, pool: [["dirt", 0.3], ["stone", 0.5], ["coal", 0.2]] },
      { title: "Слой 3 • Угольная жила", targetKg: 55000, pool: [["stone", 0.25], ["coal", 0.48], ["iron", 0.27]] },
      { title: "Слой 4 • Рудный разлом", targetKg: 160000, pool: [["coal", 0.2], ["iron", 0.5], ["gold", 0.3]] },
      { title: "Слой 5 • Глубокое ядро", targetKg: 450000, pool: [["iron", 0.35], ["gold", 0.65]] }
    ];

    function oreSvg(ore) {
      return `<svg width="26" height="26" viewBox="0 0 28 28" fill="none">
        <polygon points="5,20 5,10 13,5 23,9 22,20 14,23" fill="${ore.color}" stroke="#1c1917" stroke-width="2" />
        <circle cx="12" cy="13" r="3" fill="${ore.accent}" />
        <circle cx="18" cy="16" r="2.2" fill="${ore.accent}" />
      </svg>`;
    }

    function defaultState() {
      return {
        coins: 0,
        energy: 100,
        minedInLayer: 0,
        inv: { dirt: 0, stone: 0, coal: 0, iron: 0, gold: 0 },
        upgrades: {
          pickaxe: 1,
          rig: 1,
          battery: 1,
          warehouse: 1
        }
      };
    }

    function loadState() {
      const base = defaultState();
      try {
        const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
        return {
          ...base,
          ...raw,
          inv: { ...base.inv, ...(raw.inv || {}) },
          upgrades: { ...base.upgrades, ...(raw.upgrades || {}) }
        };
      } catch {
        return base;
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      } catch {}
    }

    function fmtNum(n) {
      if (n >= 1e9) return `${(n / 1e9).toFixed(2)} млрд`;
      if (n >= 1e6) return `${(n / 1e6).toFixed(2)} млн`;
      if (n >= 1e4) return `${(n / 1e3).toFixed(1)} тыс.`;
      return `${Math.floor(n).toLocaleString("ru-RU")}`;
    }

    function fmtKg(kg) {
      if (kg >= 1000) return `${(kg / 1000).toFixed(2)} т`;
      return `${Math.round(kg).toLocaleString("ru-RU")} кг`;
    }

    function getMaxEnergy() {
      return 100 + (state.upgrades.battery - 1) * 35;
    }

    function getStorageCapKg() {
      return Math.round(2000 * Math.pow(1.45, state.upgrades.warehouse - 1));
    }

    function getUsedKg() {
      return Object.values(state.inv).reduce((a, b) => a + (b || 0), 0);
    }

    function getTapKg() {
      return Math.round(25 * Math.pow(1.48, state.upgrades.pickaxe - 1));
    }

    function getAutoKgPerSec() {
      return Math.round(10 * Math.pow(1.42, state.upgrades.rig - 1));
    }

    function getOverallLevel() {
      return Math.min(
        state.upgrades.pickaxe,
        state.upgrades.rig,
        state.upgrades.battery,
        state.upgrades.warehouse
      );
    }

    function getCurrentLayer() {
      const idx = Math.min(LAYERS.length - 1, getOverallLevel() - 1);
      return LAYERS[idx];
    }

    function getUpgradeCost(key) {
      const lvl = state.upgrades[key];
      const base = { pickaxe: 20, rig: 30, battery: 25, warehouse: 25 }[key];
      if (lvl < 3) {
        return { type: "coins", coins: Math.round(base * Math.pow(1.75, lvl - 1)) };
      }
      const ore = ORES[Math.min(ORES.length - 1, lvl - 3)];
      const kg = Math.round(180 * Math.pow(1.5, lvl - 3));
      return { type: "ore", ore, kg };
    }

    function getSalePrice(ore, kg) {
      return Math.max(1, Math.round((kg / 1000) * ore.pricePerTon));
    }

    function addMinedKg(amount, clientX, clientY) {
      if (amount <= 0) return;
      const cap = getStorageCapKg();
      const used = getUsedKg();
      const free = Math.max(0, cap - used);
      if (free <= 0) return;

      const taken = Math.min(free, amount);
      const layer = getCurrentLayer();
      const roll = Math.random();
      let acc = 0;
      let chosenId = layer.pool[layer.pool.length - 1][0];

      for (const [id, weight] of layer.pool) {
        acc += weight;
        if (roll <= acc) {
          chosenId = id;
          break;
        }
      }

      state.inv[chosenId] = (state.inv[chosenId] || 0) + taken;
      state.minedInLayer += taken;

      if (clientX != null && clientY != null) {
        const arena = document.getElementById("tapArena");
        const rect = arena.getBoundingClientRect();
        const popup = document.createElement("div");
        popup.className = "float-popup";
        popup.textContent = `+${fmtKg(taken)}`;
        popup.style.left = `${Math.max(36, Math.min(rect.width - 36, clientX - rect.left))}px`;
        popup.style.top = `${Math.max(36, Math.min(rect.height - 36, clientY - rect.top))}px`;
        arena.appendChild(popup);
        setTimeout(() => popup.remove(), 860);
      }
    }

    function render() {
      const maxE = getMaxEnergy();
      state.energy = Math.min(maxE, Math.max(0, state.energy));

      const usedKg = getUsedKg();
      const capKg = getStorageCapKg();
      const isFull = usedKg >= capKg;
      const tapCost = 2;

      document.getElementById("hudCoins").textContent = fmtNum(state.coins);
      document.getElementById("hudRigLvl").textContent = String(getOverallLevel());
      const hudStorage = document.getElementById("hudStorage");
      hudStorage.textContent = `${fmtKg(usedKg)} / ${fmtKg(capKg)}`;
      hudStorage.style.color = isFull ? "#f87171" : "#4ade80";

      const ePct = Math.max(0, Math.min(100, (state.energy / Math.max(1, maxE)) * 100));
      document.getElementById("energyFill").style.width = `${ePct}%`;
      document.getElementById("energyLabel").textContent = `${Math.floor(state.energy)} / ${maxE}`;

      const alertBox = document.getElementById("alertBox");
      alertBox.classList.remove("hidden", "warn", "full");
      if (isFull) {
        alertBox.classList.add("full");
        alertBox.textContent = "Склад заполнен! Перейдите на склад и продайте добытое.";
      } else if (state.energy < tapCost) {
        alertBox.classList.add("warn");
        alertBox.textContent = "Не хватает энергии — нажмите «Заряд» или подождите восстановления.";
      } else {
        alertBox.classList.add("hidden");
      }

      const layer = getCurrentLayer();
      document.getElementById("layerTitle").textContent = layer.title;
      const lPct = Math.min(100, Math.round((state.minedInLayer / layer.targetKg) * 100));
      document.getElementById("layerBarFill").style.width = `${lPct}%`;
      document.getElementById("layerProgressText").textContent = `${fmtKg(state.minedInLayer)} / ${fmtKg(layer.targetKg)}`;

      const tapKg = getTapKg();
      const autoKg = getAutoKgPerSec();
      document.getElementById("tapPowerHint").textContent = `+${fmtKg(tapKg)} за клик (−${tapCost} ⚡)`;
      document.getElementById("statTap").textContent = `+${fmtKg(tapKg)}`;
      document.getElementById("statAuto").textContent = `+${fmtKg(autoKg)}/сек`;

      const tapBtn = document.getElementById("tapRockBtn");
      tapBtn.disabled = isFull || state.energy < tapCost;

      // Список последовательных улучшений
      const upDefs = [
        { key: "pickaxe", title: "Ударный инструмент", effect: `Сила клика: ${fmtKg(tapKg)}` },
        { key: "rig", title: "Авто-бур", effect: `Автодобыча: ${fmtKg(autoKg)}/сек` },
        { key: "battery", title: "Энергоячейка", effect: `Ёмкость энергии: ${maxE}` },
        { key: "warehouse", title: "Отсек склада", effect: `Вместимость: ${fmtKg(capKg)}` }
      ];

      const upList = document.getElementById("upgradesList");
      upList.innerHTML = "";

      upDefs.forEach((u) => {
        const lvl = state.upgrades[u.key];
        const req = getUpgradeCost(u.key);
        const canBuy = req.type === "coins"
          ? state.coins >= req.coins
          : (state.inv[req.ore.id] || 0) >= req.kg;

        const btnText = req.type === "coins"
          ? `Улучшить до ${lvl + 1} ур. за ${fmtNum(req.coins)} 🪙`
          : `Улучшить до ${lvl + 1} ур. за ${fmtKg(req.kg)} (${req.ore.name})`;

        const card = document.createElement("div");
        card.className = "upgrade-card";
        card.innerHTML = `
          <div class="upgrade-head">
            <div class="upgrade-name">${u.title}</div>
            <span class="lvl-badge">Уровень ${lvl}</span>
          </div>
          <div class="upgrade-effect">${u.effect}</div>
          <button class="upgrade-btn ${req.type === "ore" ? "res-mode" : ""}" type="button" ${canBuy ? "" : "disabled"}>
            ${btnText}
          </button>
        `;

        card.querySelector("button").addEventListener("click", () => {
          if (req.type === "coins") {
            if (state.coins < req.coins) return;
            state.coins -= req.coins;
          } else {
            if ((state.inv[req.ore.id] || 0) < req.kg) return;
            state.inv[req.ore.id] -= req.kg;
          }
          state.upgrades[u.key] += 1;
          saveState();
          render();
        });

        upList.appendChild(card);
      });

      // Склад: продажа по отдельности и продать всё
      let totalSell = 0;
      ORES.forEach((ore) => {
        const kg = state.inv[ore.id] || 0;
        if (kg > 0) totalSell += getSalePrice(ore, kg);
      });

      const pct = Math.min(100, Math.round((usedKg / Math.max(1, capKg)) * 100));
      document.getElementById("storageSummary").textContent = `Склад • ${pct}% (${fmtKg(usedKg)} / ${fmtKg(capKg)})`;

      const sellAllBtn = document.getElementById("sellAllBtn");
      sellAllBtn.disabled = usedKg <= 0;
      sellAllBtn.textContent = usedKg > 0 ? `Продать всё (${fmtNum(totalSell)} 🪙)` : "Продать всё";

      const stList = document.getElementById("storageList");
      stList.innerHTML = "";

      ORES.forEach((ore) => {
        const kg = state.inv[ore.id] || 0;
        const price = kg > 0 ? getSalePrice(ore, kg) : 0;

        const row = document.createElement("div");
        row.className = "ore-card";
        row.innerHTML = `
          <div class="ore-head">
            <div class="ore-icon">${oreSvg(ore)}</div>
            <div class="ore-title">${ore.name}</div>
            <div class="ore-price">${ore.pricePerTon} 🪙 / т</div>
          </div>
          <div class="ore-foot">
            <span class="ore-kg">${fmtKg(kg)}</span>
            <button class="sell-one-btn" type="button" ${kg > 0 ? "" : "disabled"}>
              ${kg > 0 ? `Продать (${fmtNum(price)} 🪙)` : "Продать"}
            </button>
          </div>
        `;

        row.querySelector("button").addEventListener("click", () => {
          const cur = state.inv[ore.id] || 0;
          if (cur <= 0) return;
          state.coins += getSalePrice(ore, cur);
          state.inv[ore.id] = 0;
          saveState();
          render();
        });

        stList.appendChild(row);
      });
    }

    document.getElementById("tapRockBtn").addEventListener("click", (e) => {
      const tapCost = 2;
      if (state.energy < tapCost || getUsedKg() >= getStorageCapKg()) return;
      state.energy = Math.max(0, state.energy - tapCost);
      addMinedKg(getTapKg(), e.clientX, e.clientY);
      saveState();
      render();
    });

    document.getElementById("refillBtn").addEventListener("click", () => {
      const add = Math.round(getMaxEnergy() * 0.35);
      state.energy = Math.min(getMaxEnergy(), state.energy + add);
      saveState();
      render();
    });

    document.getElementById("sellAllBtn").addEventListener("click", () => {
      let sum = 0;
      ORES.forEach((ore) => {
        const kg = state.inv[ore.id] || 0;
        if (kg > 0) {
          sum += getSalePrice(ore, kg);
          state.inv[ore.id] = 0;
        }
      });
      if (sum > 0) {
        state.coins += sum;
        saveState();
        render();
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      state = defaultState();
      saveState();
      render();
    });

    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const view = btn.dataset.view;
        ["clicker", "upgrades", "storage"].forEach((id) => {
          document.getElementById(`view-${id}`).classList.toggle("hidden", id !== view);
        });
      });
    });

    let ticks = 0;
    setInterval(() => {
      const dt = 0.25;
      ticks += 1;

      const maxE = getMaxEnergy();
      if (state.energy < maxE) {
        state.energy = Math.min(maxE, state.energy + 3.5 * dt);
      }

      if (state.energy >= 1 && getUsedKg() < getStorageCapKg()) {
        state.energy = Math.max(0, state.energy - 0.8 * dt);
        addMinedKg(getAutoKgPerSec() * dt);
      }

      if (ticks % 4 === 0) saveState();
      render();
    }, 250);

    render();
  </script>
</body>
</html>
