<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yard and Roosters</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f131a;
      color: #f3f6fc;
    }
    .app {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .topbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: #181e29;
      border: 1px solid #2b3548;
      border-radius: 14px;
      padding: 12px;
    }
    .stat-box {
      background: #11161f;
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }
    .stat-label { font-size: 11px; color: #9aa7bd; }
    .stat-val { font-size: 16px; font-weight: 700; margin-top: 2px; }
    .card {
      background: #181e29;
      border: 1px solid #2b3548;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-title { font-size: 16px; font-weight: 700; margin: 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    select, input, button {
      background: #222b3b;
      color: #f3f6fc;
      border: 1px solid #39465e;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
    }
    button { cursor: pointer; font-weight: 600; transition: opacity 0.15s ease; }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary { background: #2f7cf6; border-color: #2f7cf6; }
    button.success { background: #26a269; border-color: #26a269; }
    button.danger { background: #c01c28; border-color: #c01c28; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: #283347;
      color: #dbe6fa;
    }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #11161f;
      border: 1px solid #252f40;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13px;
    }
    .track-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: #11161f;
      border: 1px solid #252f40;
      border-radius: 10px;
      padding: 9px 11px;
    }
    .bar-bg {
      width: 100%;
      height: 10px;
      background: #232d3f;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: #33d17a;
      transition: width 0.25s ease;
    }
    .log-box {
      font-size: 12px;
      color: #b7c4d9;
      background: #11161f;
      border-radius: 10px;
      padding: 8px 10px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Баланс: монеты, яйца и петухи -->
    <div class="topbar">
      <div class="stat-box">
        <div class="stat-label">Монеты</div>
        <div class="stat-val" id="ui-coins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Яйца</div>
        <div class="stat-val" id="ui-eggs">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Петухов</div>
        <div class="stat-val" id="ui-roosters-count">0</div>
      </div>
    </div>

    <!-- 1. Кормушка и инкубатор -->
    <div class="card">
      <h2 class="card-title">Кормушка и инкубатор</h2>
      <div class="row">
        <button type="button" class="success" id="feed-btn">Покормить (20 монет → +яйцо и +монеты)</button>
        <button type="button" class="primary" id="hatch-btn">Высидеть яйцо (1 яйцо → петух)</button>
      </div>
      <div class="row">
        <label for="active-rooster-select" style="font-size: 13px; color: #b7c4d9;">Боец для забега:</label>
        <select id="active-rooster-select" style="flex: 1;"></select>
        <span class="pill" id="active-rooster-rarity">common</span>
      </div>
      <div class="log-box" id="farm-log">Готов к кормлению и забегам.</div>
    </div>

    <!-- 2. Создание комнаты 1x1 / 1x4 -->
    <div class="card">
      <h2 class="card-title">Создать комнату гонки</h2>
      <div class="row">
        <select id="room-mode">
          <option value="1x1">1×1 (2 игрока)</option>
          <option value="1x4">1×4 (4 игрока)</option>
        </select>

        <select id="room-bet-type">
          <option value="coins">Ставка: Монеты</option>
          <option value="egg">Ставка: Яйцо</option>
        </select>

        <input id="room-bet-amount" type="number" min="1" value="30" style="width: 100px;" />
        <button type="button" class="primary" id="create-room-btn">Создать</button>
      </div>
    </div>

    <!-- 3. Открытые комнаты -->
    <div class="card">
      <h2 class="card-title">Открытые комнаты 1×1</h2>
      <div class="list" id="rooms-1x1-list"></div>
    </div>

    <div class="card">
      <h2 class="card-title">Открытые комнаты 1×4</h2>
      <div class="list" id="rooms-1x4-list"></div>
    </div>

    <!-- 4. Экран активного заезда -->
    <div class="card" id="race-card" style="display: none;">
      <div class="row" style="justify-content: space-between;">
        <strong id="race-title">Забег</strong>
        <button type="button" class="danger" id="leave-room-btn">Выйти</button>
      </div>
      <div id="race-bet-text" style="font-size: 13px; color: #b7c4d9;"></div>
      <div class="list" id="race-tracks"></div>
      <div id="race-outcome" style="font-weight: 700; color: #f8e45c;"></div>
    </div>

    <!-- 5. Топ по балансу -->
    <div class="card">
      <h2 class="card-title">Топ по балансу</h2>
      <div class="list" id="balance-top-list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      get,
      push,
      update,
      remove,
      onValue,
      query,
      orderByChild,
      limitToLast,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAxKiUf-DCaj4A5aIoZmJezOa5UD8j60Wc",
      authDomain: "yard-and-roosters.firebaseapp.com",
      databaseURL: "https://yard-and-roosters-default-rtdb.firebaseio.com",
      projectId: "yard-and-roosters",
      storageBucket: "yard-and-roosters.firebasestorage.app",
      messagingSenderId: "978553937670",
      appId: "1:978553937670:web:9ab2c607104527aabf8887",
      measurementId: "G-6ZT24E07SW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const RARITIES = [
      { key: "common", label: "Обычный", mult: 1.0, weight: 55 },
      { key: "rare", label: "Редкий", mult: 1.15, weight: 25 },
      { key: "epic", label: "Эпический", mult: 1.32, weight: 12 },
      { key: "legendary", label: "Легендарный", mult: 1.5, weight: 6 },
      { key: "mythic", label: "Мифический", mult: 1.72, weight: 2 }
    ];

    const ROOSTER_NAMES = ["Гроза", "Искра", "Вихрь", "Шпора", "Болт", "Сокол", "Тайфун", "Коготь"];

    function getPlayerIdentity() {
      const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
      if (tgUser?.id) {
        return {
          id: String(tgUser.id),
          name: [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") || tgUser.username || `Player_${tgUser.id}`
        };
      }
      let devId = localStorage.getItem("yard_player_id");
      if (!devId) {
        devId = "p_" + Math.random().toString(36).slice(2, 8);
        localStorage.setItem("yard_player_id", devId);
      }
      return { id: devId, name: `Игрок_${devId.slice(-4)}` };
    }

    const me = getPlayerIdentity();
    const STORAGE_KEY = `yard_state_${me.id}`;

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      return {
        coins: 200,
        eggs: 2,
        roosters: [
          {
            id: "r_start_1",
            name: "Гроза",
            rarity: "common",
            rarityLabel: "Обычный",
            // Скрытые характеристики: в интерфейсе забега не показываем точные цифры
            _hiddenPower: 10
          }
        ],
        selectedRoosterId: "r_start_1"
      };
    }

    let state = loadLocalState();
    let currentRoomId = null;
    let roomUnsub = null;
    let raceTimer = null;

    function saveLocalState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getSelectedRooster() {
      return state.roosters.find((r) => r.id === state.selectedRoosterId) || state.roosters[0];
    }

    function setLog(msg) {
      document.getElementById("farm-log").textContent = msg;
    }

    async function syncBalanceToFirebase() {
      const active = getSelectedRooster();
      const totalScore = Number(state.coins || 0) + Number(state.eggs || 0) * 50;
      await update(ref(db), {
        [`players/${me.id}/profile`]: { id: me.id, name: me.name, updatedAt: Date.now() },
        [`players/${me.id}/balance`]: Number(state.coins || 0),
        [`players/${me.id}/eggs`]: Number(state.eggs || 0),
        [`leaderboard/${me.id}`]: {
          id: me.id,
          name: me.name,
          balance: Number(state.coins || 0),
          eggs: Number(state.eggs || 0),
          score: totalScore,
          roosterName: active?.name || "Петух",
          roosterRarity: active?.rarityLabel || "Обычный",
          updatedAt: Date.now()
        }
      });
    }

    function renderFarmUI() {
      document.getElementById("ui-coins").textContent = Number(state.coins || 0).toLocaleString("ru-RU");
      document.getElementById("ui-eggs").textContent = Number(state.eggs || 0).toLocaleString("ru-RU");
      document.getElementById("ui-roosters-count").textContent = String(state.roosters.length);

      const select = document.getElementById("active-rooster-select");
      select.innerHTML = state.roosters
        .map((r) => `<option value="${r.id}" ${r.id === state.selectedRoosterId ? "selected" : ""}>${escapeHtml(r.name)} (${escapeHtml(r.rarityLabel)})</option>`)
        .join("");

      const active = getSelectedRooster();
      document.getElementById("active-rooster-rarity").textContent = active?.rarityLabel || "Обычный";
    }

    function rollRarity() {
      const totalWeight = RARITIES.reduce((acc, r) => acc + r.weight, 0);
      let roll = Math.random() * totalWeight;
      for (const r of RARITIES) {
        roll -= r.weight;
        if (roll <= 0) return r;
      }
      return RARITIES[0];
    }

    // Кормление: списываем 20 монет, даём +1 яйцо и случайный бонус монет от кормления (10..35)
    document.getElementById("feed-btn").addEventListener("click", async () => {
      const feedCost = 20;
      if (state.coins < feedCost) {
        setLog("Не хватает монет на кормление (нужно минимум 20).");
        return;
      }
      const feedGain = Math.floor(Math.random() * 26) + 10;
      state.coins = state.coins - feedCost + feedGain;
      state.eggs += 1;
      saveLocalState();
      renderFarmUI();
      setLog(`Покормил хозяйство: −${feedCost} монет, +${feedGain} монет за кормление и +1 яйцо.`);
      await syncBalanceToFirebase();
    });

    // Инкубатор: высиживаем 1 яйцо -> новый петух с редкостью
    document.getElementById("hatch-btn").addEventListener("click", async () => {
      if (state.eggs < 1) {
        setLog("Нет яиц для инкубатора. Покорми птиц или выиграй ставку в гонке.");
        return;
      }
      state.eggs -= 1;
      const rarity = rollRarity();
      const baseName = ROOSTER_NAMES[Math.floor(Math.random() * ROOSTER_NAMES.length)];
      const newRooster = {
        id: "r_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 5),
        name: `${baseName} #${state.roosters.length + 1}`,
        rarity: rarity.key,
        rarityLabel: rarity.label,
        _hiddenPower: Math.floor(Math.random() * 12) + 8
      };
      state.roosters.push(newRooster);
      state.selectedRoosterId = newRooster.id;
      saveLocalState();
      renderFarmUI();
      setLog(`Вылупился боец «${newRooster.name}» (${newRooster.rarityLabel})!`);
      await syncBalanceToFirebase();
    });

    document.getElementById("active-rooster-select").addEventListener("change", async (e) => {
      state.selectedRoosterId = e.target.value;
      saveLocalState();
      renderFarmUI();
      await syncBalanceToFirebase();
    });

    function checkAndDeductBet(bet) {
      if (bet.type === "coins") {
        if (state.coins < bet.amount) return `Недостаточно монет для ставки (${bet.amount}).`;
        state.coins -= bet.amount;
        return null;
      }
      if (bet.type === "egg") {
        if (state.eggs < bet.amount) return `Недостаточно яиц для ставки (${bet.amount}).`;
        state.eggs -= bet.amount;
        return null;
      }
      return "Неизвестный тип ставки.";
    }

    function formatBet(bet) {
      if (!bet) return "Без ставки";
      return bet.type === "coins" ? `${bet.amount} монет` : `${bet.amount} яиц`;
    }

    // Создание комнаты 1x1 или 1x4
    document.getElementById("create-room-btn").addEventListener("click", async () => {
      const mode = document.getElementById("room-mode").value;
      const betType = document.getElementById("room-bet-type").value;
      const betAmount = Math.max(1, Number(document.getElementById("room-bet-amount").value) || 1);
      const bet = { type: betType, amount: betAmount };

      const err = checkAndDeductBet(bet);
      if (err) {
        setLog(err);
        return;
      }

      const active = getSelectedRooster();
      const maxPlayers = mode === "1x4" ? 4 : 2;
      const roomRef = push(ref(db, "rooms"));
      const roomId = roomRef.key;

      await set(roomRef, {
        id: roomId,
        mode,
        maxPlayers,
        status: "waiting",
        bet,
        createdAt: Date.now(),
        hostId: me.id,
        winnerId: null,
        payoutDone: false,
        players: {
          [me.id]: {
            id: me.id,
            name: me.name,
            progress: 0,
            finishedAt: null,
            racer: {
              name: active?.name || "Боец",
              rarity: active?.rarity || "common",
              rarityLabel: active?.rarityLabel || "Обычный"
            },
            _hiddenPower: active?._hiddenPower || 10
          }
        }
      });

      saveLocalState();
      renderFarmUI();
      await syncBalanceToFirebase();
      subscribeToRoom(roomId);
      setLog(`Создана комната ${mode}. Ставка списана: ${formatBet(bet)}.`);
    });

    async function joinRoom(roomId) {
      const snap = await get(ref(db, `rooms/${roomId}`));
      if (!snap.exists()) {
        setLog("Комната уже закрыта.");
        return;
      }
      const room = snap.val();
      const err = checkAndDeductBet(room.bet);
      if (err) {
        setLog(err);
        return;
      }

      const active = getSelectedRooster();
      const tx = await runTransaction(ref(db, `rooms/${roomId}`), (curr) => {
        if (!curr || curr.status !== "waiting") return;
        const players = curr.players || {};
        if (!players[me.id] && Object.keys(players).length >= curr.maxPlayers) return;

        players[me.id] = {
          id: me.id,
          name: me.name,
          progress: 0,
          finishedAt: null,
          racer: {
            name: active?.name || "Боец",
            rarity: active?.rarity || "common",
            rarityLabel: active?.rarityLabel || "Обычный"
          },
          _hiddenPower: active?._hiddenPower || 10
        };
        curr.players = players;

        if (Object.keys(players).length >= curr.maxPlayers) {
          curr.status = "countdown";
          curr.startAt = Date.now() + 2500;
        }
        return curr;
      });

      if (!tx.committed) {
        // Возвращаем списанную ставку, если не удалось войти
        if (room.bet.type === "coins") state.coins += room.bet.amount;
        if (room.bet.type === "egg") state.eggs += room.bet.amount;
        saveLocalState();
        renderFarmUI();
        setLog("Не удалось войти: комната полна или гонка началась.");
        return;
      }

      saveLocalState();
      renderFarmUI();
      await syncBalanceToFirebase();
      subscribeToRoom(roomId);
    }

    function subscribeToRoom(roomId) {
      if (roomUnsub) { roomUnsub(); roomUnsub = null; }
      if (raceTimer) { clearInterval(raceTimer); raceTimer = null; }

      currentRoomId = roomId;
      document.getElementById("race-card").style.display = "flex";
      document.getElementById("race-outcome").textContent = "";

      roomUnsub = onValue(ref(db, `rooms/${roomId}`), async (snapshot) => {
        const room = snapshot.val();
        if (!room) {
          document.getElementById("race-card").style.display = "none";
          currentRoomId = null;
          return;
        }

        const players = Object.values(room.players || {});
        const isHost = room.hostId === me.id;

        document.getElementById("race-bet-text").textContent = `Банк на ставку: ${formatBet(room.bet)} (участников: ${players.length}/${room.maxPlayers})`;

        if (room.status === "waiting") {
          document.getElementById("race-title").textContent = `Ожидание соперников (${players.length}/${room.maxPlayers}) · ${room.mode}`;
        } else if (room.status === "countdown") {
          const left = Math.max(0, Math.ceil(((room.startAt || Date.now()) - Date.now()) / 1000));
          document.getElementById("race-title").textContent = `Старт через ${left}...`;
          if (isHost && Date.now() >= (room.startAt || 0)) {
            await update(ref(db, `rooms/${roomId}`), { status: "racing" });
          }
        } else if (room.status === "racing") {
          document.getElementById("race-title").textContent = `Забег идёт · ${room.mode}`;
          if (room.players?.[me.id] && !room.players[me.id].finishedAt) {
            startRaceMovement(room);
          }
          if (isHost && !room.winnerId) {
            const finishers = players
              .filter((p) => Number(p.progress || 0) >= 100)
              .sort((a, b) => (a.finishedAt || Infinity) - (b.finishedAt || Infinity));
            if (finishers.length > 0) {
              await update(ref(db, `rooms/${roomId}`), {
                status: "finished",
                winnerId: finishers[0].id
              });
            }
          }
        } else if (room.status === "finished") {
          if (raceTimer) { clearInterval(raceTimer); raceTimer = null; }
          document.getElementById("race-title").textContent = `Забег завершён · ${room.mode}`;
          const winner = room.players?.[room.winnerId];
          const wonByMe = room.winnerId === me.id;

          if (wonByMe && !room.payoutClaimedByMe) {
            await update(ref(db, `rooms/${roomId}`), { payoutClaimedByMe: true });
            const pot = (room.bet?.amount || 0) * Math.max(2, players.length);
            if (room.bet?.type === "coins") state.coins += pot;
            if (room.bet?.type === "egg") state.eggs += pot;
            saveLocalState();
            renderFarmUI();
            await syncBalanceToFirebase();
          }

          document.getElementById("race-outcome").textContent = wonByMe
            ? `Победа! Ты забрал банк: ${formatBet({ type: room.bet?.type, amount: (room.bet?.amount || 0) * Math.max(2, players.length) })}`
            : `Победитель: ${winner?.name || "Игрок"} (${winner?.racer?.name || "Боец"})`;
        }

        // Выводим только имя игрока, имя бойца и редкость — точные скрытые статы наружу не отдаём
        document.getElementById("race-tracks").innerHTML = players
          .map((p) => {
            const pct = Math.max(0, Math.min(100, Number(p.progress || 0)));
            return `
              <div class="track-item">
                <div class="row" style="justify-content: space-between; font-size: 13px;">
                  <span>🐓 <strong>${escapeHtml(p.name)}</strong> — ${escapeHtml(p.racer?.name || "Боец")} <span class="pill">${escapeHtml(p.racer?.rarityLabel || "Обычный")}</span></span>
                  <span>${pct.toFixed(0)}%</span>
                </div>
                <div class="bar-bg"><div class="bar-fill" style="width: ${pct}%;"></div></div>
              </div>
            `;
          })
          .join("");
      });
    }

    function startRaceMovement(room) {
      if (raceTimer) return;
      const slot = room.players?.[me.id];
      if (!slot) return;

      const rarityObj = RARITIES.find((r) => r.key === slot.racer?.rarity) || RARITIES[0];
      const hiddenBonus = 0.92 + ((Number(slot._hiddenPower || 10)) % 20) * 0.01;
      let progress = Number(slot.progress || 0);

      raceTimer = setInterval(async () => {
        if (progress >= 100) {
          clearInterval(raceTimer);
          raceTimer = null;
          return;
        }
        const step = (Math.random() * 6.5 + 3.5) * rarityObj.mult * hiddenBonus;
        progress = Math.min(100, Number((progress + step).toFixed(1)));
        const updates = { [`rooms/${room.id}/players/${me.id}/progress`]: progress };
        if (progress >= 100) {
          updates[`rooms/${room.id}/players/${me.id}/finishedAt`] = Date.now();
        }
        try { await update(ref(db), updates); } catch (_) {}
      }, 350);
    }

    document.getElementById("leave-room-btn").addEventListener("click", async () => {
      if (!currentRoomId) return;
      const roomId = currentRoomId;
      if (raceTimer) { clearInterval(raceTimer); raceTimer = null; }
      if (roomUnsub) { roomUnsub(); roomUnsub = null; }
      currentRoomId = null;
      document.getElementById("race-card").style.display = "none";

      const snap = await get(ref(db, `rooms/${roomId}`));
      if (snap.exists()) {
        const room = snap.val();
        if (room.hostId === me.id || room.status === "finished") {
          await remove(ref(db, `rooms/${roomId}`));
        } else {
          await remove(ref(db, `rooms/${roomId}/players/${me.id}`));
        }
      }
    });

    // Списки открытых комнат 1x1 и 1x4
    onValue(ref(db, "rooms"), (snapshot) => {
      const r1x1 = [];
      const r1x4 = [];
      snapshot.forEach((child) => {
        const val = child.val();
        if (!val || val.status !== "waiting") return;
        const count = Object.keys(val.players || {}).length;
        if (count >= val.maxPlayers) return;
        if (val.mode === "1x1") r1x1.push({ ...val, count });
        if (val.mode === "1x4") r1x4.push({ ...val, count });
      });

      renderRoomsList("rooms-1x1-list", r1x1, "1×1");
      renderRoomsList("rooms-1x4-list", r1x4, "1×4");
    });

    function renderRoomsList(containerId, rooms, label) {
      const el = document.getElementById(containerId);
      if (!rooms.length) {
        el.innerHTML = `<div class="item-row" style="color:#9aa7bd;">Открытых комнат ${label} пока нет</div>`;
        return;
      }
      el.innerHTML = rooms
        .map((r) => `
          <div class="item-row">
            <div>
              <strong>${label}</strong> · ${r.count}/${r.maxPlayers} игроков · <span class="pill">${escapeHtml(formatBet(r.bet))}</span>
            </div>
            <button type="button" class="primary" data-join="${r.id}">Войти</button>
          </div>
        `)
        .join("");

      el.querySelectorAll("[data-join]").forEach((btn) => {
        btn.addEventListener("click", () => joinRoom(btn.getAttribute("data-join")));
      });
    }

    // Топ по балансу в реальном времени
    const topQuery = query(ref(db, "leaderboard"), orderByChild("balance"), limitToLast(10));
    onValue(topQuery, (snapshot) => {
      const list = [];
      snapshot.forEach((child) => {
        const v = child.val();
        if (v) list.push(v);
      });
      list.sort((a, b) => (b.balance || 0) - (a.balance || 0));

      const topEl = document.getElementById("balance-top-list");
      if (!list.length) {
        topEl.innerHTML = `<div class="item-row" style="color:#9aa7bd;">Пока пусто</div>`;
        return;
      }

      topEl.innerHTML = list
        .map((p, idx) => `
          <div class="item-row">
            <div>
              <strong>#${idx + 1} ${escapeHtml(p.name)}</strong> · <span style="color:#9aa7bd;">🥚 ${Number(p.eggs || 0)}</span>
            </div>
            <strong>🪙 ${Number(p.balance || 0).toLocaleString("ru-RU")}</strong>
          </div>
        `)
        .join("");
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    renderFarmUI();
    syncBalanceToFirebase().catch(() => {});
  </script>
</body>
</html>
